<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>متابعة</title>
<style>
:root{--ink:#1d3557;--bg:#eef2f7;--card:#fff;--line:#c9d3e0;--txt:#14213d;--mut:#6b7a90}
@media(prefers-color-scheme:dark){:root{--bg:#0f1724;--card:#17212f;--line:#2b3a4f;--txt:#e6ecf5;--mut:#92a1b8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:none;margin-top:env(safe-area-inset-top);height:54px;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 4px;gap:2px}
#mb{flex:none;background:none;border:0;color:#fff;font-size:24px;width:44px;height:44px;border-radius:10px}
#mb:active{background:#ffffff26}
#tb{flex:1;min-width:0;display:flex;align-items:center;gap:7px;overflow-x:auto;overflow-y:hidden;padding:0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tb::-webkit-scrollbar{display:none}
#tb button{flex:none;min-width:42px;height:40px;padding:0 13px;border-radius:20px;border:2px solid #ffffff55;background:#ffffff1a;color:#fff;font:inherit;font-size:17px;font-weight:700}
#tb button.sel{background:#fff;color:var(--ink);border-color:#fff}
#tb button.on{background:var(--c,#2a9d62);border-color:#fff;box-shadow:0 0 0 2px #fff6}
#tb .sep{flex:none;width:2px;height:26px;background:#fff7;margin:0 2px}
main{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-size:15px}
th,td{border-left:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;background:var(--card);padding:0}
th{background:var(--ink);color:#fff;font-weight:600;position:sticky;top:0;z-index:2;height:36px}
th.dh{cursor:pointer;min-width:90px;padding:0 10px;font-size:14px}
.n{position:sticky;right:0;min-width:34px;width:34px;z-index:3;color:var(--mut);font-size:12px}
.nm{position:sticky;right:34px;min-width:max(40vw,150px);max-width:62vw;text-align:right;padding:0 8px;z-index:3;font-weight:600;box-shadow:-2px 0 0 var(--line) inset;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
th.n,th.nm{z-index:5;color:#fff;cursor:default}
.nw{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn{flex:none;min-width:26px;height:26px;border-radius:13px;color:#fff;font-size:13px;line-height:26px;text-align:center;padding:0 6px}
td.c,td.e{min-width:64px;height:46px;font-weight:700;font-size:17px;cursor:pointer;user-select:none}
td.e{cursor:default}
td.c.k0{color:#d62828;background:#d6282814}td.c.k1{color:#e07a00;background:#e07a0014}
td.c.k2{color:#2a7de1;background:#2a7de114}td.c.k3{color:#2a9d8f;background:#2a9d8f14}
td.c.k4{color:#7b2cbf;background:#7b2cbf14}td.c.k5{color:#c2185b;background:#c2185b14}
td.c.k6{color:#558b2f;background:#558b2f14}td.c.k7{color:#795548;background:#79554814}
td.pm{font-size:14px;font-variant-numeric:tabular-nums;color:#fff}
td.pm.s1{background:#2a9d62}td.pm.s2{background:#e0a100}td.pm.s3{background:#d62828}td.pm.s4{background:#5b2a86}
td.pm.run{outline:2px solid #fff9;outline-offset:-3px}
td.hl{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 6px,var(--card) 6px,var(--card) 12px)}
.empty{padding:40px 20px;text-align:center;color:var(--mut);line-height:2}
#dr{position:fixed;inset:calc(54px + env(safe-area-inset-top)) 0 0 0;background:#0007;z-index:20;display:none}
#dr.o{display:block}
#dr nav{position:absolute;right:0;top:0;bottom:0;width:min(80vw,310px);background:var(--card);overflow:auto;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
#dr .wt{background:var(--ink);color:#fff;padding:12px 16px;font-size:14px;line-height:1.6;font-weight:600}
#dr h4{margin:14px 16px 4px;font-size:12px;color:var(--mut);font-weight:600}
#dr button{display:block;width:100%;text-align:right;background:none;border:0;color:var(--txt);font:inherit;font-size:15px;padding:11px 16px}
#dr button:active{background:var(--bg)}
#m{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
#m[hidden]{display:none}
.bx{background:var(--card);border-radius:14px;padding:16px;width:min(94vw,420px);max-height:86vh;overflow:auto}
.bx.w{width:min(98vw,560px)}
.bx h3{margin:0 0 10px;font-size:17px}
.bx select,.bx textarea,.bx input[type=text]{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--txt)}
.bx label{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.bx label input{width:20px;height:20px}
.bt{display:flex;gap:8px;margin-top:14px}
.bt button,.ad{flex:1;font:inherit;padding:11px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:600}
.ad{display:block;width:100%;margin:8px 0}
.bt button.g{background:var(--bg);color:var(--txt)}
.ch button{display:block;width:100%;text-align:right;font:inherit;padding:12px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt)}
.ch button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.ch small{display:block;font-size:12px;opacity:.75}
.wn{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wn div{flex:1;text-align:center;font-size:14px;font-weight:600}
.wn button{flex:none;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--txt)}
.nr{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.nr>div{flex:1}.nr small{color:var(--mut)}
.nr button{flex:none;border:0;background:none;font-size:18px}
.sm{font-size:13px;color:var(--mut);margin:6px 0}
.st{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.st th,.st td{position:static;border:1px solid var(--line);padding:5px 4px;height:auto;background:none}
.st th{background:var(--ink);color:#fff}.st td:first-child{text-align:right}
.st h5{margin:14px 0 0;font-size:15px}
.sg{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.sg th,.sg td{position:static;border:1px solid var(--line);text-align:center;padding:4px 1px;height:42px;background:var(--card);color:var(--txt)}
.sg th{background:var(--bg);font-weight:600}.sg th small{display:block;font-size:9px;color:var(--mut);font-weight:400}
.sg td{cursor:pointer;font-weight:600;color:#fff;user-select:none}.sg td.e{color:var(--mut)}
.brs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.brs button{flex:1;min-width:56px;padding:9px 4px;border:2px solid var(--c,var(--line));border-radius:8px;background:var(--card);color:var(--txt);font:inherit;font-weight:600}
.brs button.on{background:var(--c,var(--ink));color:#fff}
.cn2{margin-top:8px;font-size:13px;line-height:1.9}
.tr{display:flex;gap:6px;align-items:center;padding:5px 0}
.tr input{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--txt)}
.tr button{flex:none;font:inherit;padding:8px 12px;border:0;border-radius:8px;background:var(--bg);color:var(--txt)}
#fl{position:fixed;inset:0;z-index:15;pointer-events:none}
.chip{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;min-width:130px;max-width:70vw;padding:9px 14px;border-radius:30px;color:#fff;box-shadow:0 4px 14px #0004;user-select:none;display:flex;flex-direction:column;line-height:1.35}
.chip b{font-size:20px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.chip span{font-size:12px;opacity:.95}
.s1{background:#2a9d62}.s2{background:#e0a100}.s3{background:#d62828}.s4{background:#5b2a86}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));background:#000c;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:40;display:none;max-width:86vw;text-align:center}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;background:#fff;color:#000}
html,body{height:auto;overflow:visible;background:#fff}body{position:static!important;display:block!important}
.pt{border-collapse:collapse;width:100%;font-size:11px;page-break-after:always}.pt:last-child{page-break-after:auto}
.pt th,.pt td{border:1px solid #000;padding:2px;text-align:center;height:20px;background:#fff;color:#000;position:static}
.pt th{background:#ddd;font-weight:700}.pt td.l{text-align:right;white-space:nowrap;padding:0 4px}
.pt caption{font-size:14px;font-weight:700;text-align:right;padding-bottom:6px;caption-side:top}}
</style>
</head>
<body>
<header>
 <button id="mb" aria-label="القائمة">☰</button>
 <div id="tb"></div>
</header>
<main id="mn"></main>
<div id="fl"></div>
<div id="dr"><nav id="nv"></nav></div>
<div id="m" hidden></div>
<div id="ts"></div>
<div id="pr"></div><input type="file" id="fi" hidden><style id="pg"></style>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='mutabaa1';
const clone=o=>JSON.parse(JSON.stringify(o));
const DT=[['07:15','08:00'],['08:00','08:45'],['08:45','09:30'],['09:50','10:35'],['10:35','11:15'],['11:15','12:00']];
const PAL=['#d62828','#e07a00','#2a7de1','#2a9d8f','#7b2cbf','#c2185b','#558b2f','#795548'];
const CP=['#1d6fb8','#2a9d62','#c2185b','#e07a00','#7b2cbf','#00838f'];
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const nf=n=>new Intl.NumberFormat('ar-SA-u-nu-arab').format(n);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const sunday=(d=new Date())=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-x.getDay());return iso(x)};
const wsOf=s=>sunday(new Date(s+'T12:00:00'));
function hijri(d){const o={};new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d).forEach(p=>o[p.type]=p.value);return o}

/* ---------- الحالة ---------- */
const defS=()=>({classes:['٣-١','٣-٢','٣-٣'].map((n,i)=>({id:'c'+i,name:n,st:[]})),cur:'c0',cols:['غ','ت','م','ك','ق','ن','س','x'],recs:{},sl:{},tsets:[{n:'الأوقات الافتراضية',t:clone(DT)}],tcur:0,anchor:{start:'2026-10-25',n:10},sems:[{from:'1900-01-01',sem:1}],hol:{},dhol:{},run:[],cpos:{},arch:{}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||defS();
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function addRec(d,p,sid,n){const a=S.recs[d]||(S.recs[d]={}),b=a[p]||(a[p]={}),c=b[sid]||(b[sid]=[]);c.push(n);return n}
function clean(d,p,sid){const a=S.recs[d];if(!a)return;const b=a[p];if(b&&b[sid]&&!b[sid].length)delete b[sid];if(b&&!Object.keys(b).length)delete a[p];if(!Object.keys(a).length)delete S.recs[d]}
function rmS(sid){for(const d of Object.keys(S.recs))for(const p of Object.keys(S.recs[d])){delete S.recs[d][p][sid];clean(d,p,sid)}S.run=S.run.filter(r=>r.sid!==sid)}
function migrate(){ // تحويل النظام القديم (خلايا لكل حصة) إلى سجل ملاحظات
  if(S.marks===undefined&&S.warch===undefined&&S.days===undefined)return;
  S.recs=S.recs||{};const dh={};
  const conv=(X,wk)=>{if(!X||!Array.isArray(X.days)||!wk)return;
    const m={};X.days.forEach((d,i)=>{m[d.k]=addD(wk,i);if(S.dhol&&S.dhol[d.k])dh[m[d.k]]=1});
    for(const k in X.marks||{}){const a=k.split('|');let p,c;if(a.length===4){p=a[2];c=a[3]}else if(a.length===3){p='1';c=a[2]}else continue;const i=m[a[1]];if(i)addRec(i,p==='0'?'1':p,a[0],{t:'m',k:c})}
    for(const k in X.perm||{}){const a=k.split('|'),i=m[a[1]],v=X.perm[k];if(i)addRec(i,a[2]&&a[2]!=='0'?a[2]:'1',a[0],{t:'p',id:uid(),t0:v.t0,t1:v.t1||v.t0})}};
  Object.values(S.warch||{}).forEach(w=>conv(w,w.wk));conv(S,S.wk);
  S.dhol=dh;S.sems=[{from:'1900-01-01',sem:S.sem||1}];S.run=[];
  ['marks','perm','days','wk','warch','pi','timers','month','mname','sem'].forEach(k=>delete S[k]);
}
function norm(){const d=defS();for(const k in d)if(S[k]===undefined)S[k]=d[k]}
migrate();norm();

/* ---------- الأسابيع والفصل الدراسي ---------- */
const semOf=ws=>{let r=1;[...S.sems].sort((a,b)=>a.from<b.from?-1:1).forEach(e=>{if(e.from<=ws)r=e.sem});return r};
function weekNum(start){
  let n=S.anchor.n;const a=S.anchor.start;
  if(start>=a){for(let s=a;s<start;s=addD(s,7))if(!S.hol[s])n++}
  else{for(let s=addD(a,-7);s>=start;s=addD(s,-7))if(!S.hol[s])n--}
  return n}
const ORD=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون'];
function wkTitle(ws){const n=weekNum(ws),w=n>=1&&n<=20?'الأسبوع '+ORD[n]:'الأسبوع '+nf(n);
  return `${w} ${semOf(ws)===2?'الفصل الدراسي الثاني':'الفصل الدراسي الأول'} ${hijri(new Date(ws+'T12:00:00')).year} هـ`}
const isHol=d=>!!(S.hol[wsOf(d)]||S.dhol[d]);
const dayLab=d=>{const g=new Date(d+'T12:00:00'),p=hijri(g);return g.toLocaleDateString('ar',{weekday:'long'})+' '+nf(+p.day)+'/'+nf(+p.month)};

/* ---------- الأسماء والترتيب ---------- */
const AK=n=>String(n).replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/\s+/g,' ').trim();
const COL=new Intl.Collator('ar');
const srt=(a,b)=>COL.compare(AK(a.n),AK(b.n));
const sortC=c=>c.st.sort(srt);
const cls=()=>S.classes.find(c=>c.id===S.cur);
const stuItems=()=>{const c=cls();return c?c.st.map(s=>[s.id,s.n]):[]};
const nameOf=id=>{for(const c of S.classes){const s=c.st.find(x=>x.id===id);if(s)return s.n}return ''};

/* ---------- نوافذ ---------- */
function dlg(t,inner,get,single,lab=['موافق','إلغاء']){return new Promise(r=>{
  const m=$('#m');
  m.innerHTML=`<div class=bx><h3>${t}</h3>${inner}<div class=bt><button id=ok>${single?'إغلاق':lab[0]}</button>${single?'':`<button id=no class=g>${lab[1]}</button>`}</div></div>`;
  m.hidden=false;const done=v=>{m.hidden=true;r(v)};
  $('#ok').onclick=()=>done(get?get(m):true);
  if(!single)$('#no').onclick=()=>done(null);
})}
const yn=t=>dlg(t,'',()=>true,0,['نعم','لا']);
const pickOne=(t,items)=>dlg(t,`<select id=sel>${items.map(i=>`<option value="${i[0]}">${esc(i[1])}</option>`).join('')}</select>`,m=>m.querySelector('#sel').value);
const pickMany=(t,items)=>dlg(t,items.map(i=>`<label><input type=checkbox value="${i[0]}">${esc(i[1])}</label>`).join(''),m=>[...m.querySelectorAll('input:checked')].map(x=>x.value));
const ask=(t,v='')=>dlg(t,`<input type=text id=tx value="${esc(v)}">`,m=>m.querySelector('#tx').value.trim());

function choose(t,items,cur){return new Promise(r=>{const m=$('#m');
  m.innerHTML=`<div class=bx><h3>${t}</h3><div class=ch>${items.map(i=>`<button data-v="${esc(i[0])}" class="${i[0]===cur?'on':''}">${esc(i[1])}${i[2]?`<small>${esc(i[2])}</small>`:''}</button>`).join('')}</div><div class=bt><button class=g id=no>إلغاء</button></div></div>`;
  m.hidden=false;const done=v=>{m.hidden=true;r(v)};
  m.querySelector('.ch').onclick=e=>{const b=e.target.closest('button');if(b)done(b.dataset.v)};$('#no').onclick=()=>done(null)})}
function act(t,html,lab='تم'){return new Promise(r=>{const m=$('#m');
  m.innerHTML=`<div class=bx><h3>${t}</h3>${html}<div class=bt><button class=g id=no>${lab}</button></div></div>`;m.hidden=false;
  const done=v=>{m.onclick=null;m.hidden=true;r(v)};
  m.onclick=e=>{const b=e.target.closest('[data-o]');if(b)done({o:b.dataset.o,j:+b.dataset.j,v:(m.querySelector('#nx')||{}).value})};
  $('#no').onclick=()=>done(null)})}
let tt;function toast(t){const e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',1800)}

/* ---------- العرض (يوم واحد + حصة واحدة) ---------- */
let TOOL=null,VD={iso:'',p:1},lpDone=false;
const TM=()=>S.tsets[S.tcur].t;
const dI=s=>new Date(s+'T12:00:00').getDay();
const firstP=(cid,di)=>{for(let p=1;p<=6;p++)if(S.sl[di+'|'+p]===cid)return p;return 0};
function nowLesson(){const n=new Date(),di=n.getDay();if(di>4)return null;const hm=pad(n.getHours())+':'+pad(n.getMinutes()),tm=TM();
  for(let p=1;p<=6;p++){const t=tm[p-1];if(t&&hm>=t[0]&&hm<t[1]){const id=S.sl[di+'|'+p];return id?{cid:id,p,iso:iso(n)}:null}}return null}
function initView(){const nl=nowLesson();
  if(nl&&S.classes.some(c=>c.id===nl.cid)){S.cur=nl.cid;VD={iso:nl.iso,p:nl.p};return}
  const n=new Date(),i=n.getDay()<=4?iso(n):addD(sunday(n),4);
  if(!S.classes.some(c=>c.id===S.cur))S.cur=S.classes[0]&&S.classes[0].id;
  VD={iso:i,p:firstP(S.cur,dI(i))||1}}
function setClass(id){S.cur=id;const f=firstP(id,dI(VD.iso));if(f)VD.p=f}
function setDay(i){VD.iso=i;const f=firstP(S.cur,dI(i));if(f)VD.p=f}
const stg=m=>m<5?1:m<10?2:m<15?3:4;
const psec=n=>Math.max(0,Math.floor(((n.t1||Date.now())-n.t0)/1000));
const pfmt=n=>{const s=psec(n);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const pcl=n=>`pm s${stg(Math.floor(psec(n)/60))}${n.t1?'':' run'}`;
const slotOf=()=>(S.recs[VD.iso]||{})[VD.p]||{};
function statData(scope){
  const ws=wsOf(VD.iso),sem=semOf(ws),m={},pm={},nt={};
  for(const d in S.recs){const w=wsOf(d);if(scope==='w'?w!==ws:semOf(w)!==sem)continue;
    for(const p in S.recs[d])for(const sid in S.recs[d][p])S.recs[d][p][sid].forEach(n=>{
      if(n.t==='m'){const o=m[sid]||(m[sid]={});o[n.k]=(o[n.k]||0)+1}
      else if(n.t==='p'){const o=pm[sid]||(pm[sid]=[0,0]);o[0]++;if(n.t1)o[1]+=n.t1-n.t0}
      else nt[sid]=(nt[sid]||0)+1})}
  return{m,pm,nt}}

async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw 0;const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){
    const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    if(!/^xl\/(sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/.test(name))continue;
    const ds=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);let d=u.subarray(ds,ds+csz);
    if(meth===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    out[name]=new TextDecoder().decode(d);
  }return out;
}

      const t=c.getAttribute('t');let v;if(t==='inlineStr')v=c.textContent;else{const x=c.querySelector('v')?.textContent??'';v=t==='s'?ss[+x]:x}a[j<0?a.length:j]=v});

function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const f=t.split('\n')[0]||'';
  const dl=[',',';','\t','،'].sort((a,b)=>f.split(b).length-f.split(a).length)[0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===dl){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows;
}

const isLetters=s=>/[\u0600-\u06FFA-Za-z]{2,}/.test(s||'');
const noBin=s=>s.replace(/(^|\s)بن(?=\s|$)/g,' ').replace(/\s+/g,' ').trim();
function namesFrom(rows){
  rows=rows.map(r=>Array.from(r,x=>String(x??'').trim())).filter(r=>r.some(Boolean));if(!rows.length)return[];
  const isH=s=>/^(ال)?(اسم|أسم|طالب|اسماء|أسماء)|name|student/i.test(s);
  let ci=-1,st=0;
  for(let i=0;i<Math.min(3,rows.length)&&ci<0;i++)rows[i].forEach((c,j)=>{if(ci<0&&isH(cleanN(c))){ci=j;st=i+1}});
  if(ci<0){let bs=0;const w=Math.max(...rows.map(r=>r.length));
    for(let j=0;j<w;j++){const s=new Set(rows.filter(r=>isLetters(r[j])).map(r=>cleanN(r[j]))).size;if(s>bs){bs=s;ci=j}}}
  if(ci<0)return[];
  return rows.slice(st).map(r=>noBin(cleanN(r[ci]||''))).filter(isLetters);
}

 async impNames(){const c=cls();if(!c)return alert('اختر فصلاً أولاً');
  const f=await pickFile('.csv,.txt,.xlsx,text/csv,text/plain');if(!f)return;
  let rows;try{const b=await f.arrayBuffer();
    if(/\.xlsx$/i.test(f.name))rows=await xlsxRows(b);
    else if(/\.xls$/i.test(f.name))return alert('صيغة xls القديمة غير مدعومة. احفظ الملف بصيغة xlsx أو csv ثم أعد المحاولة.');
    else{let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('windows-1256').decode(b)}rows=parseCSV(t)}
  }catch(e){return alert('تعذّرت قراءة الملف')}
  const names=namesFrom(rows);if(!names.length)return alert('لم أجد أسماء في الملف');
  const r=await dlg(`تم العثور على ${nf(names.length)} اسم`,'<div style="font-size:13px;color:var(--mut);margin-bottom:6px">راجع الأسماء وعدّلها إن لزم (اسم في كل سطر). المكرر لا يُضاف.</div><textarea id=tx rows=10>'+esc(names.join('\n'))+'</textarea>',m=>m.querySelector('#tx').value);
  if(!r)return;const have=new Set(c.st.map(s=>AK(s.n)));let add=0;
  r.split('\n').map(cleanN).filter(Boolean).forEach(n=>{if(!have.has(AK(n))){have.add(AK(n));c.st.push({id:'s'+uid(),n});add++}});
  alert(`أُضيف ${nf(add)} طالب`)},

 async editStu(){const id=await pickOne('اختر الطالب',stuItems());if(!id)return;const s=cls().st.find(x=>x.id===id);const n=await ask('تعديل الاسم',s.n);if(n)s.n=n},
 async moveStu(){const id=await pickOne('اختر الطالب للنقل',stuItems());if(!id)return;
  const o=S.classes.filter(c=>c!==cls()).map(c=>[c.id,c.name]);if(!o.length)return;
  const to=await pickOne('النقل إلى فصل',o);if(!to)return;
  const f=cls(),s=f.st.find(x=>x.id===id);f.st=f.st.filter(x=>x!==s);S.classes.find(c=>c.id===to).st.push(s)},
 async delStu(){const id=await pickOne('اختر الطالب للحذف',stuItems());if(!id)return;const f=cls(),s=f.st.find(x=>x.id===id);
  if(!(await yn(`حذف الطالب ${esc(s.n)} وسجلاته؟`)))return;f.st=f.st.filter(x=>x!==s);rmS(id);chips()},
 async setSem(){const v=await pickOne('الفصل الدراسي (من الأسبوع الحالي فصاعدًا)',[['1','الفصل الدراسي الأول'],['2','الفصل الدراسي الثاني']]);
  if(!v)return;const cw=sunday();S.sems=S.sems.filter(e=>e.from!==cw);S.sems.push({from:cw,sem:+v})},
 async setWk(){const ws=wsOf(VD.iso),r=await ask('رقم الأسبوع المعروض',String(weekNum(ws)));if(!r)return;
  const n=parseInt(r.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)),10);
  if(!(n>=1&&n<=60))return alert('أدخل رقمًا بين 1 و60');S.anchor={start:ws,n}},
 async wkHol(){const ws=wsOf(VD.iso),on=!!S.hol[ws];if(!(await yn(on?'هذا الأسبوع إجازة. هل تريد إلغاء الإجازة؟':'هل تريد وضع هذا الأسبوع «إجازة»؟')))return;if(on)delete S.hol[ws];else S.hol[ws]=1},
 async stAll(){const sd=await statScope();if(sd)await dlg('إحصائيات جميع الفصول',statHTML(sd,S.classes),null,1)},
 async stCls(){const c=cls();if(!c)return;const sd=await statScope();if(sd)await dlg('إحصائيات '+esc(c.name),statHTML(sd,[c]),null,1)},
 async stStu(){const id=await pickOne('اختر الطالب',stuItems());if(!id)return;const sd=await statScope();if(sd)await dlg('إحصائيات طالب',statHTML(sd,[cls()],id),null,1)},
 prDay(){const c=cls();if(!c||!c.st.length)return alert('لا يوجد طلاب للطباعة');sortC(c);const r=slotOf(),N=Math.max(1,...c.st.map(s=>(r[s.id]||[]).length));
  let h=`<table class=pt><caption>${esc(c.name)} · ${dayLab(VD.iso)}${isHol(VD.iso)?' (إجازة)':''} · ح${nf(VD.p)}</caption><tr><th>#</th><th>الاسم</th>${Array.from({length:N},(_,i)=>`<th>${nf(i+1)}</th>`).join('')}</tr>`;
  c.st.forEach((s,j)=>{const a=r[s.id]||[];h+=`<tr><td>${nf(j+1)}</td><td class=l>${esc(s.n)}</td>${Array.from({length:N},(_,i)=>`<td>${a[i]?ntxt(a[i],1):''}</td>`).join('')}</tr>`});
  doPrint(h+'</table>',0)},
 prWeek(){const c=cls();if(!c||!c.st.length)return alert('لا يوجد طلاب للطباعة');sortC(c);const ws=wsOf(VD.iso),ds=[0,1,2,3,4].map(i=>addD(ws,i));
  const cell=(sid,d)=>{const ps=S.recs[d]||{};return Object.keys(ps).sort().map(p=>pcell(ps[p][sid])).filter(Boolean).join(' ')};
  let h=`<table class=pt><caption>${esc(c.name)} · ${wkTitle(ws)}</caption><tr><th>#</th><th>الاسم</th>${ds.map(d=>`<th>${dayLab(d)}${isHol(d)?' · إجازة':''}</th>`).join('')}</tr>`;
  c.st.forEach((s,j)=>{h+=`<tr><td>${nf(j+1)}</td><td class=l>${esc(s.n)}</td>${ds.map(d=>`<td>${cell(s.id,d)}</td>`).join('')}</tr>`});
  doPrint(h+'</table>',1)},
 async prStu(){const id=await pickOne('اختر الطالب للطباعة',stuItems());if(!id)return;const c=cls(),s=c.st.find(x=>x.id===id),ws=wsOf(VD.iso);
  let h=`<table class=pt><caption>${esc(s.n)} · ${esc(c.name)} · ${wkTitle(ws)}</caption><tr><th>اليوم</th>${[1,2,3,4,5,6].map(p=>`<th>ح${nf(p)}</th>`).join('')}</tr>`;
  for(let i=0;i<5;i++){const d=addD(ws,i);h+=`<tr><td class=l>${dayLab(d)}${isHol(d)?' · إجازة':''}</td>${[1,2,3,4,5,6].map(p=>`<td>${pcell(((S.recs[d]||{})[p]||{})[id],1)}</td>`).join('')}</tr>`}
  doPrint(h+'</table>',1)},
 prSched(){const tm=TM();if(!Object.keys(S.sl).length)return alert('لم يُدخل الجدول بعد');
  const nm=id=>(S.classes.find(c=>c.id===id)||{}).name||'';
  let h=`<table class=pt><caption>الجدول الدراسي</caption><tr><th></th>${[1,2,3,4,5,6].map(p=>`<th>ح${nf(p)}<br><small>${tm[p-1][0]} – ${tm[p-1][1]}</small></th>`).join('')}</tr>`;
  DN.forEach((d,di)=>{h+=`<tr><td class=l>${d}</td>${[1,2,3,4,5,6].map(p=>`<td>${esc(nm(S.sl[di+'|'+p]))}</td>`).join('')}</tr>`});
  doPrint(h+'</table>',1)},
 async schedEdit(){
  const cs=S.classes;if(!cs.length)return alert('أضف فصولًا أولًا');
  const W=clone(S.sl),tm=TM();let br=cs[0].id;
  const col=id=>CP[cs.findIndex(c=>c.id===id)%CP.length];
  const draw=()=>{
    const cnt={},two={},day={};
    Object.keys(W).forEach(k=>{const di=k.split('|')[0],c=W[k];cnt[c]=(cnt[c]||0)+1;two[c+'|'+di]=(two[c+'|'+di]||0)+1;day[di]=(day[di]||0)+1});
    let h=`<div class=brs>${cs.map(c=>`<button data-b="${c.id}" class="${br===c.id?'on':''}" style="--c:${col(c.id)}">${esc(c.name)}</button>`).join('')}<button data-b="" class="${br===''?'on':''}">فارغ</button></div><table class=sg><tr><th></th>${[1,2,3,4,5,6].map(p=>`<th${p===4?' style="border-right:3px double var(--mut)"':''}>ح${nf(p)}<small>${(tm[p-1]||[''])[0]}</small></th>`).join('')}</tr>`;
    DN.forEach((d,di)=>{h+=`<tr><th>${d}</th>`;
      for(let p=1;p<=6;p++){const id=W[di+'|'+p],c=cs.find(x=>x.id===id),bd=p===4?'border-right:3px double var(--mut);':'';h+=`<td data-s="${di}|${p}" ${c?`style="${bd}background:${col(id)}"`:`class=e style="${bd}"`}>${c?esc(c.name):'—'}</td>`}
      h+='</tr>'});
    h+='</table><div class=cn2>';
    cs.forEach(c=>{const n=cnt[c.id]||0,tw=[0,1,2,3,4].filter(di=>(two[c.id+'|'+di]||0)===2).length,ov=[0,1,2,3,4].some(di=>(two[c.id+'|'+di]||0)>2),bad=n!==6||tw!==1||ov;
      h+=`<span style="color:${bad?'#d62828':'#2a9d62'};margin-inline-end:12px;white-space:nowrap">${esc(c.name)}: ${nf(n)}/${nf(6)}${bad?' ⚠':' ✓'}</span>`});
    h+=`<br>المجموع: ${nf(Object.keys(W).length)} حصة · حسب الأيام: ${[0,1,2,3,4].map(di=>nf(day[di]||0)).join(' · ')}<br><small style="color:var(--mut)">المتوقع: ٦ حصص لكل فصل، وحصتان في يوم واحد فقط. اختر فصلًا من الأعلى ثم اضغط الخانات (فارغ = لا توجد حصة).</small></div>`;
    $('#sg').innerHTML=h};
  const pr=dlg('الجدول الدراسي','<div id=sg></div>',()=>true,0,['حفظ','إلغاء']);
  $('#m .bx').classList.add('w');draw();
  $('#sg').onclick=e=>{const b=e.target.closest('[data-b]'),t=e.target.closest('[data-s]');
    if(b)br=b.dataset.b;else if(t){if(br)W[t.dataset.s]=br;else delete W[t.dataset.s]}draw()};
  if(!(await pr))return;S.sl=W},
 async timesEdit(){
  const W=clone(S.tsets);let cur=S.tcur;
  let rows='';for(let i=0;i<6;i++)rows+=`<div class=tr><span style="width:34px">ح${nf(i+1)}</span><input type=time id=a${i}><input type=time id=b${i}></div>`;
  const read=()=>{const s=W[cur];s.n=$('#tn').value.trim()||s.n;s.t=[0,1,2,3,4,5].map(i=>[$('#a'+i).value,$('#b'+i).value])};
  const pr=dlg('أوقات الحصص',`<select id=ts></select><input type=text id=tn style="margin:8px 0" placeholder="اسم المجموعة">${rows}<div class=bt><button class=g id=t0>الافتراضي</button><button class=g id=tw>مجموعة جديدة</button><button class=g id=tx>حذف</button></div>`,()=>{
    read();for(const t of W[cur].t)if(!t[0]||!t[1]||t[0]>=t[1]){alert('تحقق من الأوقات: يجب أن تكون النهاية بعد البداية.');return null}return true},0,['حفظ واعتماد','إلغاء']);
  const fill=()=>{const s=W[cur];$('#tn').value=s.n;s.t.forEach((t,i)=>{$('#a'+i).value=t[0];$('#b'+i).value=t[1]})};
  const opts=()=>{$('#ts').innerHTML=W.map((s,i)=>`<option value="${i}"${i===cur?' selected':''}>${esc(s.n)}${i===S.tcur?' (المعتمدة)':''}</option>`).join('')};
  opts();fill();
  $('#ts').onchange=()=>{read();cur=+$('#ts').value;opts();fill()};
  $('#t0').onclick=()=>{DT.forEach((t,i)=>{$('#a'+i).value=t[0];$('#b'+i).value=t[1]})};
  $('#tw').onclick=()=>{read();W.push({n:'مجموعة جديدة',t:clone(W[cur].t)});cur=W.length-1;opts();fill()};
  $('#tx').onclick=()=>{if(W.length<2)return alert('لا يمكن حذف المجموعة الوحيدة');W.splice(cur,1);cur=0;opts();fill()};
  if(!(await pr))return;
  S.tsets=W;S.tcur=cur},
 exp(){dl(`mutabaa-${iso(new Date())}.json`,JSON.stringify(S),'application/json')},
 async imp(){const f=await pickFile('.json,application/json');if(!f)return;let o;
  try{o=JSON.parse(await f.text());if(!Array.isArray(o.classes))throw 0}catch(e){return alert('الملف غير صالح')}
  if(!(await yn('سيتم استبدال جميع البيانات الحالية بالملف. متابعة؟')))return;
  S=o;migrate();norm();S.run=[];if(!S.classes.some(c=>c.id===S.cur))S.cur=S.classes[0]&&S.classes[0].id;initView()}
};

/* ---------- القائمة الجانبية ---------- */
const MENU=[['الأسبوع'],['الفصل الدراسي (الأول / الثاني)','setSem'],['تعديل رقم الأسبوع','setWk'],['إجازة الأسبوع (تفعيل / إلغاء)','wkHol'],
 ['الفصول'],['إضافة فصل','addClass'],['تعديل الفصل الحالي','editClass'],['حذف الفصل الحالي','delClass'],
 ['الطلاب'],['إضافة طالب','addStu'],['استيراد أسماء (Excel / CSV)','impNames'],['تعديل طالب','editStu'],['نقل طالب','moveStu'],['حذف طالب','delStu'],
 ['الجدول الدراسي'],['تعديل الجدول','schedEdit'],['أوقات الحصص','timesEdit'],
 ['الإحصائيات'],['كل الفصول','stAll'],['هذا الفصل','stCls'],['طالب','stStu'],
 ['الطباعة'],['ورقة اليوم (الملاحظات)','prDay'],['الجدول الأسبوعي للفصل','prWeek'],['أسبوع طالب','prStu'],['الجدول الدراسي','prSched'],
 ['البيانات'],['تصدير البيانات','exp'],['استيراد البيانات','imp']];
function drawer(){
  let h=`<div class=wt>${wkTitle(wsOf(VD.iso))}${S.hol[wsOf(VD.iso)]?' · إجازة':''}</div>`;
  MENU.forEach(m=>h+=m[1]?`<button data-a="${m[1]}">${m[0]}</button>`:`<h4>${m[0]}</h4>`);
  $('#nv').innerHTML=h}
const setDr=o=>{$('#dr').classList.toggle('o',o);$('#mb').textContent=o?'✕':'☰'};
$('#mb').onclick=()=>{const o=!$('#dr').classList.contains('o');if(o)drawer();setDr(o)};
$('#dr').onclick=async e=>{
  const b=e.target.closest('button');
  if(!b){if(e.target.id==='dr')setDr(false);return}
  setDr(false);await A[b.dataset.a]();save();render();chips()};

/* ---------- تشغيل ---------- */
let hid=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hid=Date.now()}else{if(Date.now()-hid>600000)initView();render();chips()}});
initView();render();chips();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
